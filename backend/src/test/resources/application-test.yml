spring:
  datasource:
    url: jdbc:h2:mem:wms-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

security:
  jwt:
    issuer: test-wms
    secret: test-only-change-me-to-a-strong-32-byte-secret
    expires-minutes: 60
